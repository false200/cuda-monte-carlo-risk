<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#ffffff"/>
  <text x="48" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" fill="#1f2937">Proposed AWS Batch path</text>
  <text x="48" y="78" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#6b7280">Source in aws/ and docker/. Designed in SAM. This Batch stack was not deployed. Live demo is a separate EC2 dashboard VM.</text>

  <!-- Cards -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- 1 API Gateway -->
    <rect x="40" y="130" width="260" height="170" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="60" y="168" font-size="20" font-weight="700" fill="#9a3412">1  Amazon API Gateway</text>
    <text x="60" y="198" font-size="15" fill="#7c2d12">HTTP API</text>
    <text x="60" y="222" font-size="15" fill="#7c2d12">POST /jobs</text>
    <text x="60" y="246" font-size="15" fill="#7c2d12">GET /jobs/{job_id}</text>
    <text x="60" y="270" font-size="14" fill="#9a3412">aws/template.yaml</text>

    <!-- 2 Lambda -->
    <rect x="380" y="130" width="280" height="170" rx="18" fill="#fefce8" stroke="#fde047" stroke-width="2"/>
    <text x="400" y="168" font-size="20" font-weight="700" fill="#854d0e">2  AWS Lambda</text>
    <text x="400" y="198" font-size="15" fill="#713f12">python3.12 · handler.py</text>
    <text x="400" y="222" font-size="15" fill="#713f12">256 MB · 30 s</text>
    <text x="400" y="246" font-size="15" fill="#713f12">validate + write S3 + SubmitJob</text>
    <text x="400" y="270" font-size="14" font-weight="700" fill="#b45309">does NOT run CUDA</text>

    <!-- 3 S3 -->
    <rect x="740" y="120" width="260" height="150" rx="18" fill="#ecfdf5" stroke="#6ee7b7" stroke-width="2"/>
    <text x="760" y="158" font-size="20" font-weight="700" fill="#065f46">3  Amazon S3</text>
    <text x="760" y="188" font-size="15" fill="#064e3b">jobs/ prefix</text>
    <text x="760" y="212" font-size="15" fill="#064e3b">AES256 · 14-day expiry</text>
    <text x="760" y="236" font-size="15" fill="#064e3b">job.txt + result.json</text>

    <!-- 4 Batch -->
    <rect x="740" y="320" width="280" height="160" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="760" y="358" font-size="20" font-weight="700" fill="#1e3a8a">4  AWS Batch</text>
    <text x="760" y="388" font-size="15" fill="#1e40af">spot queue</text>
    <text x="760" y="412" font-size="15" fill="#1e40af">g4dn.xlarge / g5.xlarge</text>
    <text x="760" y="436" font-size="15" fill="#1e40af">runs same mc_engine on GPU</text>

    <!-- 5 ECR -->
    <rect x="1100" y="320" width="260" height="160" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
    <text x="1120" y="358" font-size="20" font-weight="700" fill="#5b21b6">5  Amazon ECR</text>
    <text x="1120" y="388" font-size="15" fill="#6b21a8">docker/Dockerfile</text>
    <text x="1120" y="412" font-size="15" fill="#6b21a8">CUDA image + mc_engine</text>
    <text x="1120" y="436" font-size="15" fill="#6b21a8">pulled by Batch workers</text>

    <!-- 6 EC2 -->
    <rect x="740" y="540" width="280" height="140" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="760" y="578" font-size="20" font-weight="700" fill="#334155">6  Amazon EC2</text>
    <text x="760" y="608" font-size="15" fill="#475569">Batch GPU hosts only</text>
    <text x="760" y="632" font-size="15" fill="#475569">spot g4dn / g5</text>
    <text x="760" y="656" font-size="14" font-weight="700" fill="#b45309">not the dashboard VM</text>

    <!-- IAM / VPC -->
    <rect x="40" y="740" width="320" height="100" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="60" y="780" font-size="18" font-weight="700" fill="#334155">AWS IAM</text>
    <text x="60" y="808" font-size="15" fill="#475569">Lambda, Batch, EC2 instance roles</text>

    <rect x="400" y="740" width="320" height="100" rx="16" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    <text x="420" y="780" font-size="18" font-weight="700" fill="#334155">Amazon VPC</text>
    <text x="420" y="808" font-size="15" fill="#475569">subnets + security groups for Batch</text>
  </g>

  <!-- Arrows -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>
  <g stroke="#64748b" stroke-width="2.5" fill="none" marker-end="url(#arrow)" font-family="Segoe UI, Arial, sans-serif">
    <!-- 1 -> 2 -->
    <line x1="300" y1="215" x2="372" y2="215"/>
    <text x="318" y="205" font-size="13" fill="#64748b">invoke</text>

    <!-- 2 -> 3 -->
    <line x1="660" y1="180" x2="732" y2="180"/>
    <text x="670" y="170" font-size="13" fill="#64748b">put job.txt</text>

    <!-- 2 -> 4 -->
    <path d="M520 300 C520 360, 700 360, 735 360"/>
    <text x="560" y="350" font-size="13" fill="#64748b">SubmitJob / DescribeJobs</text>

    <!-- 4 -> 3 write result -->
    <line x1="860" y1="320" x2="860" y2="278"/>
    <text x="870" y="305" font-size="13" fill="#64748b">write result.json</text>

    <!-- 5 -> 4 pull image -->
    <line x1="1100" y1="400" x2="1028" y2="400"/>
    <text x="1035" y="390" font-size="13" fill="#64748b">pull image</text>

    <!-- 4 -> 6 -->
    <line x1="880" y1="480" x2="880" y2="532"/>
    <text x="890" y="512" font-size="13" fill="#64748b">launches GPU hosts</text>

    <!-- status read from S3 back conceptually: Lambda reads S3 -->
    <path d="M870 120 C870 95, 520 95, 520 130"/>
    <text x="620" y="88" font-size="13" fill="#64748b">GET status may read result.json</text>
  </g>
</svg>
